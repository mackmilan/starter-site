<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/placeholder.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Starter</title>
    <meta name="description" content="Estrutura inicial para um site institucional com conteúdo dinâmico, formulários e navegação responsiva." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0D10] text-[#E5E7EB] font-sans antialiased selection:bg-[#C5A059] selection:text-black min-h-screen flex flex-col">
    <div id="app">
      <div style="min-height: 100vh; background-color: #080A0C; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #C5A059; font-family: 'Inter', -apple-system, sans-serif;">
        <div style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
          <img src="/images/placeholder.svg" alt="Site Starter" style="width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(197, 160, 89, 0.4));" />
        </div>
        <div style="margin-top: 24px; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: #C5A059; font-weight: 600;">SITE STARTER</div>
        <div style="margin-top: 8px; font-size: 18px; font-family: 'Cormorant Garamond', Georgia, serif; color: #F5F3EF;">Conteúdo & Experiência</div>
        <div style="margin-top: 20px; width: 140px; height: 2px; background: rgba(197, 160, 89, 0.2); border-radius: 2px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: #C5A059; border-radius: 2px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
