services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_TENANT_ID: ${VITE_TENANT_ID:-default}
        OPENAPI_URL: ${OPENAPI_URL:-http://localhost:8000/api/docs/site}
        VITE_OPENAPI_URL: ${VITE_OPENAPI_URL:-http://localhost:8000/api/docs/site}
    restart: unless-stopped
    expose:
      - "80"
